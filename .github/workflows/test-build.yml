# Fork-only: builds the patch bundle from dev and publishes it as a "test-build" pre-release,
# so it can be downloaded on a phone and loaded into Morphe Manager. Not for upstream PRs.
name: Test build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Keeps Gradle and the downloaded dependencies between runs, like the release workflow.
      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build patch bundle
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid

      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha=$(git rev-parse --short HEAD)
          mpp=$(ls patches/build/libs/*.mpp | head -n 1)
          # Morphe Manager follows this file and updates when version or created_at changes.
          # It is pushed to its own branch below, because the Manager rewrites github.com links.
          jq -n \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg description "Simple Calculator preview $short_sha. Not an official release." \
            --arg download_url "https://github.com/$GITHUB_REPOSITORY/releases/download/test-build/$(basename "$mpp")" \
            --arg version "test-$short_sha" \
            '{created_at: $created_at, description: $description, download_url: $download_url,
              signature_download_url: "", version: $version}' > patches-bundle.json
          gboard=$(jq -r .target_version patches/src/main/resources/gboard/gboard-version-bindings.json)
          source_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/test-build-manifest/patches-bundle.json"
          upstream="https://github.com/jasonwu1994/Gboard-patches/pull"
          cat > notes.md <<NOTES
          Preview of the Simple Calculator pull requests, on top of the latest Gboard-patches. Not an official release.

          - [#13]($upstream/13): percentages, powers, √, π, currencies and implicit multiplication
          - [#14]($upstream/14): results as native Gboard suggestions, folded and unfolded

          For Gboard $gboard.

          **Install with Morphe Manager**
          1. Add a patch source with this URL: \`$source_url\`
          2. Turn the official Gboard-patches source off while patching, since this build uses the same patch names.
          3. Patch Gboard with Simple Calculator selected, then turn it on in Gboard's patch settings.

          Morphe Manager picks up new previews from this source automatically.
          NOTES
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build "$mpp" patches-bundle.json \
            --prerelease --target "$GITHUB_SHA" \
            --title "Simple Calculator preview $short_sha" \
            --notes-file notes.md
          # Add this to Morphe Manager as a source:
          # https://raw.githubusercontent.com/<owner>/<repo>/refs/heads/test-build-manifest/patches-bundle.json
          manifest_dir=$(mktemp -d)
          cp patches-bundle.json "$manifest_dir"
          cd "$manifest_dir"
          git init -q -b test-build-manifest
          git add patches-bundle.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Test build $short_sha"
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" test-build-manifest
